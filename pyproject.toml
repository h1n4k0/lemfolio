[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lemfolio"
version = "0.1.0"
description = "Local-first research workspace with a provider-independent research harness"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "sympy>=1.13,<2", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lemfolio = "lemfolio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
